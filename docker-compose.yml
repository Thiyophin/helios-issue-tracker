services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: helios-api

    ports:
      - '5000:5000'

    env_file:
      - .env.docker

    depends_on:
      - mongodb
      - seq

  mongodb:
    image: mongo:8.0

    container_name: helios-mongodb

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}

    volumes:
      - mongodb_data:/data/db

    ports:
      - '127.0.0.1:27018:27017'

  seq:
    image: datalust/seq:latest

    container_name: helios-seq

    environment:
      ACCEPT_EULA: Y
      SEQ_FIRSTRUN_ADMINUSERNAME: ${SEQ_ADMIN_USERNAME}
      SEQ_FIRSTRUN_ADMINPASSWORD: ${SEQ_ADMIN_PASSWORD}

    ports:
      - '127.0.0.1:5341:80'

    volumes:
      - seq_data:/data

volumes:
  mongodb_data:
  seq_data:
